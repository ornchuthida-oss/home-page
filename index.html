<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="login-card">
        <div class="brand-panel">
          <div class="brand-badge">T</div>
          <h1>Welcome back</h1>
          <p>
            Access your workspace and continue building your next big idea.
          </p>
          <ul class="feature-list">
            <li>Secure account access</li>
            <li>Fast project updates</li>
            <li>Personalized dashboard</li>
          </ul>
        </div>

        <div class="form-panel">
          <div class="header-row">
            <span class="eyebrow">Sign in</span>
            <a href="#">Create account</a>
          </div>

          <h2>Log in to your account</h2>

          <form class="login-form">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" />

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" />

            <div class="options-row">
              <label class="checkbox-wrap">
                <input type="checkbox" checked />
                <span>Remember me</span>
              </label>
              <a href="#">Forgot password?</a>
            </div>

            <button type="submit">Sign in</button>
          </form>

          <div class="divider"><span>or continue with</span></div>

          <div class="social-row">
            <button type="button" class="social-btn">Google</button>
            <button type="button" class="social-btn">GitHub</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
